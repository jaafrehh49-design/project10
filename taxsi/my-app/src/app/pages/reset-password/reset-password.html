<div class="login-wrapper">

    <h1 class="welcome-text">Welcome to Taxi Line</h1>
  
    <div class="login-box">
      <h2>New Password</h2>
  
      <form (ngSubmit)="reset()" autocomplete="off">
  
        <!-- Password -->
        <div class="input-group">
          <i class="fa fa-lock"></i>
  
          <input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="New Password"
            [(ngModel)]="password"
            name="password"
            required
          />
  
          <!-- 👁 العين -->
          <i
            class="fa"
            [class.fa-eye]="!showPassword"
            [class.fa-eye-slash]="showPassword"
            (click)="togglePassword()"
          ></i>
        </div>
  
        <!-- Confirm Password -->
        <div class="input-group">
          <i class="fa fa-lock"></i>
  
          <input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Confirm Password"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
          />
  
          <!-- 👁 نفس العين -->
          <i
            class="fa"
            [class.fa-eye]="!showPassword"
            [class.fa-eye-slash]="showPassword"
            (click)="togglePassword()"
          ></i>
        </div>
  
        <!-- زر -->
        <button type="submit">
          Reset Password
        </button>
  
      </form>
    </div>
  
  </div>
